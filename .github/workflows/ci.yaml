name: CI Pipeline

on:
  # push:
  #   branch: main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version should be like v1.1.0'
        required: true

env:
  IMAGE_NAME: skillexchange

jobs:
  ci:
    name: ci build image push to hub
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Image Build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ inputs.release_tag }} .
      
      - name: Login to Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push to Hub
        runs: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ inputs.release_tag }}
      


